[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pedidos"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic[email]>=2.6",      
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",      
    "boto3>=1.34",
    "alembic>=1.13",             
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "httpx>=0.27",               
    "moto[dynamodb]>=5.0",       
    "ruff>=0.3",
]

# --- src layout: los paquetes viven bajo src/ -------------------------------
# Esto hace que 'domain', 'api' y 'repositories' sean importables tras
# `pip install -e .`, sin tener que exportar PYTHONPATH a mano.
[tool.setuptools.packages.find]
where = ["src"]

# --- pytest -----------------------------------------------------------------
[tool.pytest.ini_options]
pythonpath = ["src"]             
testpaths = ["tests"]
addopts = "-ra"

# --- ruff (lint + format) ---------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # errores, pyflakes, imports ordenados, upgrades, bugbear